services:
  web:
    image: oven/bun:1.3.14
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports: ["3000:3000"]
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/.data/local.db
      - CHOKIDAR_USEPOLLING=true
    command: ["sh","-ec","mkdir -p .data && bun install --frozen-lockfile && (cd packages/web && bun x drizzle-kit push --force || true) && cd packages/web && exec bunx vite --host 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD","bun","-e","fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure
volumes:
  node_modules:
